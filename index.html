<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng đến với trang web của tôi</title>
    <!-- Liên kết tệp CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề trang -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả -->
    <p class="description">
        Đây là trang web mẫu được thiết kế để luyện tập thuộc tính màu nền (background-color) và ảnh nền (background-image) trong CSS.
    </p>

    <!-- Khối div chứa nội dung quan trọng có ảnh nền -->
    <div class="featured-box">
        <h2>Nội dung quan trọng</h2>
        <p>Khối này sử dụng ảnh nền đẹp mắt, chữ hiển thị rõ ràng và được căn giữa hoàn toàn.</p>
    </div>

</body>
</html>
